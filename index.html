<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DVHome</title>
    <!-- Añadido ?v=2 para forzar la actualización del caché de estilo en iOS -->
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DVHome">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
    <div id="app">
        <!-- Pantalla 1: Ranking y Sugerencias -->
        <main id="view-ranking" class="view active">
            <h1 class="page-title">🏆 Inicio</h1>
            
            <div style="margin-bottom: 20px; text-align: center; color: var(--text-secondary); font-size: 14px;">
                Viendo tareas de: 
                <select id="select-mi-usuario" style="background: none; border: none; font-weight: bold; color: var(--accent-color); font-size: 16px;"></select>
            </div>

            <div id="sugerencias-container" style="display: none; margin-bottom: 20px;">
                <h2 class="section-title">Recordatorios para ti</h2>
                <div id="sugerencias-list" class="list-container"></div>
            </div>

            <h2 class="section-title">Líder de la Semana</h2>
            <div class="card winner-card" id="lider-semana"></div>
            
            <h2 class="section-title">Tabla de posiciones</h2>
            <div id="ranking-list" class="list-container"></div>
        </main>

        <!-- Pantalla 2: Registrar Tarea -->
        <main id="view-registrar" class="view">
            <h1 class="page-title">✅ Registrar</h1>
            <div class="form-container">
                <form id="form-tarea">
                    <div class="input-group">
                        <label for="select-persona">¿Quién eres?</label>
                        <select id="select-persona" required></select>
                    </div>
                    <div class="input-group">
                        <label for="select-tarea">¿Qué tarea has hecho?</label>
                        <select id="select-tarea" required></select>
                    </div>
                    
                    <!-- Oculto por defecto, solo sale si es Pasear perro -->
                    <div class="input-group" id="group-turno" style="display: none;">
                        <label for="select-turno">Turno del paseo</label>
                        <select id="select-turno">
                            <option value="Mañana">🌅 Mañana</option>
                            <option value="Tarde">☀️ Tarde</option>
                            <option value="Noche">🌙 Noche</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="input-fecha">Fecha y hora (Déjalo vacío para usar la actual)</label>
                        <input type="datetime-local" id="input-fecha">
                    </div>
                    <button type="submit" class="btn-primary">Guardar Registro</button>
                </form>
                <button type="button" class="btn-secondary" onclick="document.getElementById('modal-nueva-tarea').style.display='block'">➕ Crear nueva tarea</button>
            </div>
        </main>

        <!-- Pantalla 3: Detalles por Tarea (Avanzado) -->
        <main id="view-detalles" class="view">
            <h1 class="page-title">🔍 Análisis de Tarea</h1>
            <div class="input-group">
                <select id="select-detalle-tarea" style="font-size: 18px; font-weight: bold; color: var(--accent-color); border: 2px solid var(--accent-color); background-color: #f0f8ff;"></select>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="det-total-veces">0</div>
                    <div class="stat-label">Veces Realizada</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #34c759, #28a745);">
                    <div class="stat-value" id="det-ultima-vez" style="font-size: 16px; margin-top: 6px;">--</div>
                    <div class="stat-label">Última Vez</div>
                </div>
            </div>
            
            <h2 class="section-title">🏆 Top Realizadores</h2>
            <div id="detalle-ranking" class="list-container" style="margin-bottom: 20px;"></div>
            
            <h2 class="section-title">🕒 Historial Específico</h2>
            <div id="detalle-historial" class="list-container"></div>
        </main>

        <!-- Pantalla 4: Historial General -->
        <main id="view-historial" class="view">
            <h1 class="page-title">🕒 Historial</h1>
            <div id="historial-list" class="list-container"></div>
        </main>

        <!-- Modal Nueva Tarea (Flotante y Oculto) -->
        <div id="modal-nueva-tarea" class="modal" style="display: none;">
            <div class="card" style="margin-top: 60px;">
                <h2>Nueva Tarea en el Catálogo</h2>
                <form id="form-nueva-tarea" style="margin-top: 15px;">
                    <div class="input-group">
                        <label>Nombre de la tarea</label>
                        <input type="text" id="input-nueva-tarea" required>
                    </div>
                    <div class="input-group">
                        <label>Puntos asignados</label>
                        <input type="number" id="input-puntos-tarea" value="1" required>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Tarea</button>
                    <button type="button" class="btn-secondary" onclick="document.getElementById('modal-nueva-tarea').style.display='none'">Cancelar</button>
                </form>
            </div>
        </div>

        <!-- Navegación inferior (4 botones a 25%) -->
        <nav class="tab-bar">
            <button class="tab-item active" onclick="navigate('view-ranking', this)">
                <span class="icon">🏆</span><span>Inicio</span>
            </button>
            <button class="tab-item" onclick="navigate('view-registrar', this)">
                <span class="icon">☑️️</span><span>Registrar</span>
            </button>
            <button class="tab-item" onclick="navigate('view-detalles', this)">
                <span class="icon">🔍</span><span>Detalles</span>
            </button>
            <button class="tab-item" onclick="navigate('view-historial', this)">
                <span class="icon">🕒</span><span>Historial</span>
            </button>
        </nav>
    </div>
    <script src="script.js?v=3"></script>
</body>
</html>
